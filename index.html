<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DFX – A New Taste Experience</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<style>
/* ---------- tokens ---------- */
:root{
  /* 1 "p" = 1 native tablet pixel of a 1200x1920 (portrait) or 1920x1200 (landscape) tablet.
     Everything scales from it, so both orientations look right on any tablet size. */
  --p: min(calc(100vw / 1200), calc(100vh / 1920));
  --cu:#c8896a; --cu-hi:#efc2a6; --cu-lo:#8f4f35; --ink:#000;
  --sans:"Helvetica Neue","Neue Haas Grotesk Text Pro",Helvetica,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  --serif:"Trajan Pro","Cinzel","Times New Roman","Noto Serif",serif;
  --edge: linear-gradient(135deg,#f0c4a8 0%,#b8795a 35%,#7d4330 60%,#d79f82 100%);
}
@media (orientation:landscape){
  :root{ --p: min(calc(100vw / 1920), calc(100vh / 1200)); }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{font-family:var(--sans);color:#fff}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;-webkit-user-drag:none;pointer-events:none}
#app{position:fixed;inset:0;overflow:hidden;background:#000}

/* ---------- animated background ---------- */
#bg{position:absolute;inset:0;pointer-events:none}
#bg>*{position:absolute;transition:opacity 1s ease}
#bg .glow{inset:0;background:
   radial-gradient(60% 40% at 18% 45%,rgba(200,110,60,.16),transparent 70%),
   radial-gradient(50% 35% at 85% 60%,rgba(120,70,50,.18),transparent 70%)}
.chev{inset:0;width:100%;height:100%}
.chev polyline{fill:none;stroke:#c8703f;vector-effect:non-scaling-stroke}
.chev .a{stroke-width:calc(var(--p)*3);opacity:.9;filter:drop-shadow(0 0 calc(var(--p)*8) rgba(230,120,60,.9))}
.chev .b{stroke-width:calc(var(--p)*1.5);opacity:.35}
.chev .run{stroke:#ffd2b0;stroke-width:calc(var(--p)*4);stroke-dasharray:6 94;stroke-dashoffset:0;opacity:.0;
  animation:run 7s linear infinite}
@keyframes run{0%{stroke-dashoffset:6;opacity:0}8%{opacity:.9}60%{opacity:.9}100%{stroke-dashoffset:-100;opacity:0}}
.stripes,.floor{
  background:repeating-linear-gradient(118deg,rgba(0,0,0,0) 0 calc(var(--p)*22),rgba(160,100,75,.28) calc(var(--p)*22) calc(var(--p)*30),rgba(30,18,14,.9) calc(var(--p)*30) calc(var(--p)*46),rgba(0,0,0,0) calc(var(--p)*46) calc(var(--p)*58));
}
.stripes{inset:0;clip-path:polygon(100% 20%,27% 81%,100% 81%);
  -webkit-mask-image:linear-gradient(120deg,transparent 15%,#000 70%);mask-image:linear-gradient(120deg,transparent 15%,#000 70%)}
.stripes::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,190,150,.22) 50%,transparent 60%);
  background-size:250% 100%;animation:sweep 9s ease-in-out infinite}
@keyframes sweep{0%{background-position:130% 0}60%,100%{background-position:-60% 0}}
.floor{left:0;right:0;top:81%;bottom:0;transform:scaleY(-1);opacity:.55;
  -webkit-mask-image:linear-gradient(100deg,transparent 18%,#000 58%);mask-image:linear-gradient(100deg,transparent 18%,#000 58%)}
.floor::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,0),#000 92%)}
.horizon{left:0;right:0;top:81%;height:calc(var(--p)*4);
  background:linear-gradient(90deg,transparent,#8f4f35 20%,#f0b48e 50%,#8f4f35 80%,transparent);
  box-shadow:0 0 calc(var(--p)*22) rgba(240,150,90,.7)}
.horizon::after{content:"";position:absolute;top:0;bottom:0;width:22%;background:linear-gradient(90deg,transparent,#fff3e6,transparent);
  animation:hz 6s ease-in-out infinite}
@keyframes hz{0%{left:-25%}70%,100%{left:105%}}
.streaks{inset:0;
  background:repeating-linear-gradient(128deg,transparent 0 calc(var(--p)*150),rgba(120,70,50,.5) calc(var(--p)*150) calc(var(--p)*205),rgba(40,25,20,.7) calc(var(--p)*205) calc(var(--p)*260),transparent calc(var(--p)*260) calc(var(--p)*420));
  -webkit-mask-image:linear-gradient(160deg,transparent 35%,#000 75%);mask-image:linear-gradient(160deg,transparent 35%,#000 75%);
  filter:blur(calc(var(--p)*5))}
#app .glow,#app .chev,#app .stripes,#app .floor,#app .horizon,#app .streaks{opacity:0}
#app[data-bg="full"] .glow,#app[data-bg="full"] .chev,#app[data-bg="full"] .stripes,
#app[data-bg="full"] .floor,#app[data-bg="full"] .horizon{opacity:1}
#app[data-bg="full"] .floor{opacity:.55}
#app[data-bg="streak"] .streaks{opacity:.8}
@media (orientation:landscape){
  .stripes{clip-path:polygon(100% 12%,45% 82%,100% 82%)}
  .floor,.horizon{top:82%}
}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* page wipe */
#wipe{position:absolute;inset:-10%;pointer-events:none;opacity:0;z-index:50;
  background:linear-gradient(105deg,transparent 35%,rgba(210,130,90,.0) 42%,rgba(255,200,160,.35) 50%,rgba(210,130,90,0) 58%,transparent 65%);
  background-size:300% 100%;background-position:120% 0}
#wipe.go{animation:wipe .9s ease-in-out}
@keyframes wipe{0%{opacity:1;background-position:120% 0}100%{opacity:1;background-position:-20% 0}}

/* ---------- chrome ---------- */
#flags{position:absolute;top:calc(var(--p)*22);right:calc(var(--p)*34);z-index:30;display:flex;gap:calc(var(--p)*6)}
#flags button{padding:calc(var(--p)*8);border-radius:calc(var(--p)*10);transition:transform .2s,opacity .3s}
#flags svg{display:block;width:calc(var(--p)*92);height:calc(var(--p)*46);border-radius:calc(var(--p)*5);
  opacity:.5;transition:opacity .3s, box-shadow .3s}
#flags button.on svg{opacity:1;box-shadow:0 0 0 calc(var(--p)*3) var(--cu),0 0 calc(var(--p)*22) rgba(230,140,90,.7)}
#flags button:active{transform:scale(.9)}
#fs{position:absolute;top:calc(var(--p)*22);left:calc(var(--p)*30);z-index:30;width:calc(var(--p)*72);height:calc(var(--p)*72);
  display:grid;place-items:center;opacity:.35;transition:opacity .3s}
#fs:active{opacity:1}
#fs svg{width:55%;height:55%;stroke:var(--cu);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(var(--p)*110) calc(var(--p)*50) calc(var(--p)*60);
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .55s ease,visibility 0s .55s;z-index:5}
.screen.active{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .55s ease .15s,visibility 0s}
.screen.leaving{visibility:visible}
.rv{opacity:0}
.screen.active .rv{animation:rise .9s cubic-bezier(.2,.75,.25,1) calc(var(--d,0)*1s + .25s) both}
.screen.leaving .rv{opacity:1}
@keyframes rise{from{opacity:0;transform:translateY(calc(var(--p)*34))}to{opacity:1;transform:none}}
.screen.active .zoom{animation:zoomin 1.1s cubic-bezier(.2,.75,.25,1) calc(var(--d,0)*1s + .25s) both}
@keyframes zoomin{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}

/* hero (logo + tagline) */
.hero{display:flex;flex-direction:column;align-items:center}
.logo{width:calc(var(--p)*640);aspect-ratio:620/350}
.logo svg{width:100%;height:100%;overflow:visible}
.hero.small .logo{width:calc(var(--p)*560)}
.tag{margin-top:calc(var(--p)*50);text-align:center;color:var(--cu)}
.t1{font-size:calc(var(--p)*50);letter-spacing:.32em;font-weight:300;padding-left:.32em}
.t1 b{font-family:var(--serif);font-weight:800;letter-spacing:.14em;font-size:1.02em}
.t2{margin-top:calc(var(--p)*10);font-size:calc(var(--p)*84);letter-spacing:.27em;font-weight:300;padding-left:.27em}
.split{display:flex;flex-direction:column;align-items:center;gap:calc(var(--p)*120)}
.ask{display:flex;flex-direction:column;align-items:center;gap:calc(var(--p)*52)}
.q{font-size:calc(var(--p)*56);color:var(--cu);font-weight:300;text-align:center;letter-spacing:.01em;max-width:calc(var(--p)*1000)}
.row{display:flex;gap:calc(var(--p)*26);justify-content:center}
.sub{font-size:calc(var(--p)*42);color:var(--cu);letter-spacing:.06em;text-transform:uppercase;font-weight:300;text-align:center;
  margin:calc(var(--p)*130) 0 calc(var(--p)*120)}
.menu{display:flex;flex-direction:column;gap:calc(var(--p)*50);align-items:center}
.msg{font-size:calc(var(--p)*58);color:var(--cu);font-weight:300;text-align:center;max-width:calc(var(--p)*900);line-height:1.35}
.packs{width:calc(var(--p)*1000);display:flex}
.pk{opacity:0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent),linear-gradient(180deg,transparent,#000 6%,#000 78%,transparent);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent),linear-gradient(180deg,transparent,#000 6%,#000 78%,transparent);
  mask-composite:intersect}
.screen.active .pk{animation:pkrise 1.1s cubic-bezier(.2,.8,.25,1) calc(var(--d,0)*1s + .25s) both}
.screen.leaving .pk{opacity:1}
@keyframes pkrise{0%{opacity:0;transform:translateY(calc(var(--p)*150)) scale(.88)}60%{opacity:1}100%{opacity:1;transform:none}}
.welcome{gap:calc(var(--p)*30)}
.welcome .hero{margin-top:calc(var(--p)*-10)}
.welcome .side{display:flex;flex-direction:column;align-items:center;gap:calc(var(--p)*30)}
.choose-wrap{display:contents}
.craft .txt{width:100%;display:flex;flex-direction:column;align-items:center}
.sepl+.pt{margin-top:calc(var(--p)*44)}

/* buttons */
.btn{position:relative;overflow:hidden;color:var(--cu);text-transform:uppercase;letter-spacing:.05em;
  background:linear-gradient(180deg,#5a3626 0%,#241510 55%,#000 100%);
  border:calc(var(--p)*4) solid transparent;
  transition:transform .15s ease,filter .2s ease;
  --edgebg:linear-gradient(180deg,#e8b698,#a96a4b 50%,#7f452f)}
.btn::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none}
.btn::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(110deg,transparent 42%,rgba(255,225,205,.38) 50%,transparent 58%);background-size:260% 100%;
  animation:sheen 5s ease-in-out infinite;animation-delay:var(--sd,1.2s)}
@keyframes sheen{0%{background-position:140% 0}45%,100%{background-position:-50% 0}}
.btn:active{transform:scale(.95);filter:brightness(1.4)}
.btn>*{position:relative;z-index:1}
.para{width:calc(var(--p)*232);height:calc(var(--p)*106);border-radius:calc(var(--p)*30);transform:skewX(-22deg);
  border-color:#b8795a;box-shadow:0 0 calc(var(--p)*16) rgba(220,130,80,.35),inset 0 0 calc(var(--p)*14) rgba(255,170,120,.18)}
.para:active{transform:skewX(-22deg) scale(.95)}
.para span{display:block;transform:skewX(22deg);font-style:italic;font-weight:600;font-size:calc(var(--p)*42);color:#fff;letter-spacing:.03em}
.rect{display:flex;align-items:center;width:auto;min-width:calc(var(--p)*570);height:calc(var(--p)*110);padding-left:calc(var(--p)*58);
  border-radius:calc(var(--p)*14);border-color:#b8795a;
  box-shadow:0 0 calc(var(--p)*22) rgba(220,130,80,.42),inset 0 0 calc(var(--p)*16) rgba(255,170,120,.16);
  background:#000;text-align:left;font-size:calc(var(--p)*42);font-weight:400}
.rect .lbl{flex:1;white-space:nowrap;padding-right:calc(var(--p)*36)}
.rect .sep{width:calc(var(--p)*2);align-self:stretch;margin:calc(var(--p)*16) 0;background:var(--cu);opacity:.9}
.rect .arr{width:calc(var(--p)*150);display:grid;place-items:center}
.rect .arr svg{width:calc(var(--p)*56);height:calc(var(--p)*34);stroke:var(--cu);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
  animation:nudge 2.2s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(calc(var(--p)*9))}}
.rect.big{width:calc(var(--p)*775);height:calc(var(--p)*150);font-size:calc(var(--p)*50)}
.rect.big .arr{width:calc(var(--p)*190)}
.rect.center{justify-content:center;padding:0}
.rect.center .lbl{flex:none;color:#fff;font-weight:600;font-size:calc(var(--p)*52)}
.rect.done{opacity:.55}

/* content pages */
.page{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.head{text-align:center;margin-top:calc(var(--p)*30)}
.title{font-size:calc(var(--p)*104);font-weight:300;letter-spacing:.015em;text-transform:uppercase;line-height:1.05;
  background:linear-gradient(180deg,#f0c8ad 0%,#c48465 55%,#7a4230 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.rule{width:calc(var(--p)*500);height:calc(var(--p)*3);margin:calc(var(--p)*44) auto 0;
  background:linear-gradient(90deg,transparent,#c8896a 18%,#e8b698 50%,#c8896a 82%,transparent);transform-origin:center}
.screen.active .rule{animation:grow 1s ease .35s both}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.foot{padding-bottom:calc(var(--p)*0)}
.frame{border:calc(var(--p)*3) solid transparent;border-radius:calc(var(--p)*22);
  background:linear-gradient(#000,#000) padding-box,var(--edge) border-box;position:relative}

/* craft */
.card.craft{width:calc(var(--p)*1100);padding:calc(var(--p)*80) calc(var(--p)*60) calc(var(--p)*370);display:flex;flex-direction:column;align-items:center}
.pt{text-align:center}
.pt h3{font-size:calc(var(--p)*56);font-weight:300;color:var(--cu);text-transform:uppercase;letter-spacing:.01em;line-height:1.1}
.pt p{margin-top:calc(var(--p)*14);font-size:calc(var(--p)*40);font-weight:300;line-height:1.5;max-width:calc(var(--p)*720)}
.pt+.pt,.pt+.sepl{margin-top:calc(var(--p)*48)}
.sepl{width:calc(var(--p)*222);height:calc(var(--p)*2);background:var(--cu);margin:calc(var(--p)*44) auto 0}
.leaves{position:absolute;left:50%;bottom:calc(var(--p)*-62);width:calc(var(--p)*665);margin-left:calc(var(--p)*-332);mix-blend-mode:screen}
.screen.active .leaves{animation:leaf 1.4s cubic-bezier(.2,.75,.25,1) .9s both}
@keyframes leaf{from{opacity:0;transform:translateY(calc(var(--p)*60)) scale(.94)}to{opacity:1;transform:none}}
.leaves img{width:100%}

/* innovation */
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--p)*42);width:calc(var(--p)*1000)}
.icard{border:calc(var(--p)*5) solid #b8795a;border-radius:calc(var(--p)*20);background:#000;
  box-shadow:0 0 calc(var(--p)*20) rgba(220,130,80,.4),inset 0 0 calc(var(--p)*16) rgba(220,130,80,.22);
  height:calc(var(--p)*590);padding:calc(var(--p)*34) calc(var(--p)*30);display:flex;flex-direction:column;align-items:center;text-align:center;
  transition:transform .2s,box-shadow .2s}
.icard:active{transform:scale(.97);box-shadow:0 0 calc(var(--p)*34) rgba(240,150,90,.8),inset 0 0 calc(var(--p)*22) rgba(220,130,80,.4)}
.ico{height:calc(var(--p)*250);display:flex;align-items:center;justify-content:center;width:100%}
.ico img{max-height:100%;max-width:92%;mix-blend-mode:screen}
.icard h4{margin-top:calc(var(--p)*28);font-size:calc(var(--p)*36);font-weight:400;color:var(--cu);text-transform:uppercase;line-height:1.15}
.icard p{margin-top:calc(var(--p)*22);font-size:calc(var(--p)*31);font-weight:300;line-height:1.45}

/* design */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--p)*34);width:calc(var(--p)*980)}
.tile{border-radius:calc(var(--p)*30);padding:calc(var(--p)*4);background:var(--edge);aspect-ratio:1;overflow:hidden;
  transition:transform .25s ease,box-shadow .25s ease}
.tile img{width:100%;height:100%;object-fit:cover;border-radius:calc(var(--p)*26);transition:transform .8s ease}
.tile:active{transform:scale(.97);box-shadow:0 0 calc(var(--p)*30) rgba(240,150,90,.7)}
.tile:active img{transform:scale(1.08)}
.copy{width:calc(var(--p)*900);text-align:justify;text-justify:inter-word;color:var(--cu);font-size:calc(var(--p)*36);line-height:1.5;letter-spacing:.04em;margin-top:calc(var(--p)*38)}

/* choose */
.choose-title{font-size:calc(var(--p)*118);line-height:1.08}
.pod{padding:calc(var(--p)*0);width:calc(var(--p)*1105);overflow:hidden}
.cols{display:grid;grid-template-columns:352fr 380fr 349fr}
.col{display:block;position:relative;text-align:center;color:var(--cu);outline:none}
.col.pk{-webkit-mask-image:none;mask-image:none}
.lift{transition:transform .45s cubic-bezier(.2,.8,.25,1),opacity .4s,filter .4s}
.lab{padding:calc(var(--p)*72) calc(var(--p)*6) calc(var(--p)*8);font-size:calc(var(--p)*34);line-height:1.3;transition:color .3s}
.lab b{font-weight:400;text-transform:uppercase;letter-spacing:.02em;display:block}
.col img{width:100%;margin-top:calc(var(--p)*-4);mix-blend-mode:screen}
.col::before{content:"";position:absolute;left:-12%;right:-12%;top:18%;height:48%;background:radial-gradient(closest-side,rgba(250,150,70,.55),transparent);opacity:0;transition:opacity .45s;pointer-events:none}
.col.sel::before{opacity:1}
.lift{position:relative;z-index:1}
.col.sel .lift{transform:translateY(calc(var(--p)*-30)) scale(1.045)}
.col.sel .lab{color:#fff}
.cols.has-sel .col:not(.sel) .lift{opacity:.38;filter:saturate(.4)}
.col .tap{position:absolute;left:50%;bottom:calc(var(--p)*34);width:calc(var(--p)*58);height:calc(var(--p)*58);margin-left:calc(var(--p)*-29);border-radius:50%;
  border:calc(var(--p)*3) solid rgba(255,210,180,.9);opacity:0;pointer-events:none}
.screen.active .cols:not(.has-sel):not(.touched) .col .tap{animation:ping 2.4s ease-out 2.6s infinite}
@keyframes ping{0%{opacity:.9;transform:scale(.4)}70%,100%{opacity:0;transform:scale(1.7)}}
/* end */
.end{--k:1;text-align:center;color:var(--cu);display:flex;flex-direction:column;align-items:center}
.end .disc{font-size:calc(var(--p)*38*var(--k));letter-spacing:.2em;font-weight:300;text-transform:uppercase;padding-left:.2em}
.end .logo{width:calc(var(--p)*640*var(--k));margin-top:calc(var(--p)*-8)}
.end .tag{margin-top:calc(var(--p)*55*var(--k))}
.end .t1{font-size:calc(var(--p)*52*var(--k))}
.end .t2{font-size:calc(var(--p)*82*var(--k));display:flex;align-items:center;justify-content:center}
.xi{display:inline-block;height:1.35em;aspect-ratio:430/350;margin:0 -.04em;position:relative;top:-.02em}
.xi svg{width:100%;height:100%;overflow:visible}
.end .sig{margin-top:calc(var(--p)*70*var(--k));font-size:calc(var(--p)*46*var(--k));letter-spacing:.14em;font-weight:300;padding-left:.14em}
.end .t3{margin-top:calc(var(--p)*12*var(--k));font-size:calc(var(--p)*62*var(--k));font-weight:300;letter-spacing:.06em;display:flex;align-items:center;justify-content:center}
.end .btn{margin-top:calc(var(--p)*100*var(--k))}

/* logo animation */
.lg-draw{animation:lgdraw var(--dur,.8s) cubic-bezier(.55,0,.25,1) var(--del,0s) both}
@keyframes lgdraw{to{stroke-dashoffset:0}}
.lg-df{animation:lgdf .9s ease-out .05s both}
@keyframes lgdf{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.lg-flash{transform-box:fill-box;transform-origin:center;animation:lgflash 1s ease-out 1.45s both}
@keyframes lgflash{0%{opacity:0;transform:scale(.1)}25%{opacity:.55}100%{opacity:0;transform:scale(2.4)}}
.xi .lg-draw{--dur:.6s}

/* ---------- landscape layouts ---------- */
@media (orientation:landscape){
  .screen{padding:calc(var(--p)*70) calc(var(--p)*80) calc(var(--p)*50)}
  .split{flex-direction:row;gap:calc(var(--p)*170);justify-content:center}
  .logo{width:calc(var(--p)*560)}
  .t1{font-size:calc(var(--p)*42)}
  .t2{font-size:calc(var(--p)*70)}
  .q{font-size:calc(var(--p)*58)}
  .hero.small .logo{width:calc(var(--p)*520)}
  .sub{margin:calc(var(--p)*0) 0 calc(var(--p)*50);font-size:calc(var(--p)*40)}
  .menu .rect.big{height:calc(var(--p)*140)}
  .menu{gap:calc(var(--p)*34)}
  .menuwrap{display:flex;flex-direction:column;align-items:center}
  .welcome{flex-direction:row;gap:calc(var(--p)*60)}
  .packs{width:calc(var(--p)*900)}
  .welcome .side{display:flex;flex-direction:column;align-items:center;gap:calc(var(--p)*20)}
  .title{font-size:calc(var(--p)*82)}
  .rule{margin-top:calc(var(--p)*24);width:calc(var(--p)*420)}
  .head{margin-top:calc(var(--p)*0)}
  .card.craft{width:calc(var(--p)*1560);flex-direction:row;align-items:center;justify-content:space-between;padding:calc(var(--p)*50) calc(var(--p)*90)}
  .craft .txt{flex:1;display:flex;flex-direction:column;align-items:center}
  .pt h3{font-size:calc(var(--p)*46)}
  .pt p{font-size:calc(var(--p)*34);max-width:calc(var(--p)*760)}
  .pt+.pt,.pt+.sepl{margin-top:calc(var(--p)*28)}
  .sepl{margin-top:calc(var(--p)*28)}
  .sepl+.pt{margin-top:calc(var(--p)*28)}
  .leaves{position:relative;left:auto;bottom:auto;margin:0;width:calc(var(--p)*600);flex:none}
  .grid4{grid-template-columns:repeat(4,1fr);width:calc(var(--p)*1700);gap:calc(var(--p)*30)}
  .icard{height:calc(var(--p)*600);padding:calc(var(--p)*30) calc(var(--p)*22)}
  .ico{height:calc(var(--p)*250)}
  .icard h4{font-size:calc(var(--p)*32)}
  .icard p{font-size:calc(var(--p)*29)}
  .tiles{grid-template-columns:repeat(4,1fr);width:calc(var(--p)*1700);gap:calc(var(--p)*28)}
  .copy{width:calc(var(--p)*1300);font-size:calc(var(--p)*34);margin-top:calc(var(--p)*30)}
  .choose-wrap{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:calc(var(--p)*110);width:100%}
  .choose-wrap .head{text-align:left}
  .choose-wrap .rule{margin-left:0}
  .choose-title{font-size:calc(var(--p)*96)}
  .choose-wrap{flex:1;margin-top:calc(var(--p)*30)}
  .pod{width:calc(var(--p)*800)}
  .lab{font-size:calc(var(--p)*30);padding-top:calc(var(--p)*36)}
  .end{--k:.7}
  .end .disc{font-size:calc(var(--p)*32)}
}
@media (orientation:landscape) and (min-aspect-ratio:2/1){ .end{--k:.62} }
@media (prefers-reduced-motion:reduce){ .chev .run,.stripes::after,.horizon::after{animation:none} }
</style>
</head>

<div id="app" data-bg="full">
  <div id="bg">
    <div class="glow"></div>
    <svg class="chev" viewBox="0 0 100 100" preserveAspectRatio="none">
      <polyline class="b" points="0,17 20,49 0,79"/>
      <polyline class="a" points="-2,20 19,50 -2,78"/>

    </div>

    </div>

      <line x1="${A[0]-20}" y1="${A[1]+16}" x2="${B[0]+20}" y2="${B[1]-16}" stroke="#fff" stroke-width="150" class="lg-draw" style="--dur:.85s;--del:${df?1.15:.6}s;stroke-dasharray:560;stroke-dashoffset:560"/></mask>
  </defs>
  ${df?`<g class="lg-df" fill="url(#g${id})" fill-rule="evenodd">
    <path d="M12,105 H100 C146,105 170,135 170,175 C170,215 146,245 100,245 H12Z M50,138 V212 H96 C121,212 131,196 131,175 C131,154 121,138 96,138Z"/>
    <path d="M186,105 H266 V138 H224 V159 H258 V190 H224 V245 H186Z"/></g>`:''}
  <g mask="url(#ma${id})"><polygon points="250,63 325,63 505,278 430,278" fill="url(#g${id})"/><polygon points="250,63 325,63 505,278 430,278" fill="url(#v${id})"/></g>
  <g mask="url(#mb${id})"><polygon points="${thick}" fill="url(#g${id})"/></g>
  <g fill="none" stroke="url(#g${id})" stroke-linecap="round">
    <path d="${thin(40)}" pathLength="1" stroke-width="4.5" class="lg-draw" style="--dur:.9s;--del:${df?1.55:1.0}s;stroke-dasharray:1;stroke-dashoffset:1"/>
    <path d="${thin(57)}" pathLength="1" stroke-width="3.2" class="lg-draw" style="--dur:.9s;--del:${df?1.7:1.15}s;stroke-dasharray:1;stroke-dashoffset:1"/>
  </g>
  ${df?`<circle class="lg-flash" cx="378" cy="172" r="46" fill="#ffc9a0" opacity="0" style="filter:blur(12px)"/>`:''}
</svg>`;
}
function xiSVG(){ return logoSVG({df:false}); }

/* ===================== flags ===================== */
const FLAGS = {
  mk:`<svg viewBox="0 0 60 30"><rect width="60" height="30" fill="#D20000"/><g fill="#FFE600">${[0,45,90,135,180,225,270,315].map(a=>{const r=a*Math.PI/180,s=5.5*Math.PI/180;return `<polygon points="30,15 ${(30+90*Math.cos(r-s)).toFixed(1)},${(15+90*Math.sin(r-s)).toFixed(1)} ${(30+90*Math.cos(r+s)).toFixed(1)},${(15+90*Math.sin(r+s)).toFixed(1)}"/>`}).join('')}<circle cx="30" cy="15" r="7.4" fill="#D20000"/><circle cx="30" cy="15" r="6" /></g></svg>`,
  en:`<svg viewBox="0 0 60 30"><clipPath id="fs1"><path d="M0,0 v30 h60 v-30z"/></clipPath><clipPath id="ft1"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30z"/></clipPath><g clip-path="url(#fs1)"><path d="M0,0 v30 h60 v-30z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#ft1)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></svg>`,
  sq:`<svg viewBox="0 0 60 30"><rect width="60" height="30" fill="#E41E20"/><polygon fill="#000" points="30,6 28,8 27,11 22,9 15,11 9,15 13,15 10,19 15,18 14,22 19,20 21,24 25,21 27,26 30,23 33,26 35,21 39,24 41,20 46,22 45,18 50,19 47,15 51,15 45,11 38,9 33,11 32,8"/></svg>`
};

/* ===================== app logic ===================== */
const $ = (s,r=document)=>r.querySelector(s), $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const app = $('#app');
let lang='en', current=null, visited=new Set(), lock=false, idleTimer=null, sorryTimer=null;

const ARROW = '<svg viewBox="0 0 56 34"><path d="M2 17H52M36 3L52 17L36 31"/></svg>';

function buildHeroes(){
  $$('[data-hero]').forEach(el=>{
    const small = el.dataset.hero==='small';
    el.className='hero rv'+(small?' small':''); el.style.setProperty('--d','0');
    el.innerHTML = `<div class="logo" data-logo></div>` + (el.dataset.hero==='tag'
      ? `<div class="tag"><div class="t1">A NEW <b>TASTE</b></div><div class="t2">EXPERIENCE</div></div>` : '');
  });
  $$('.arr').forEach(a=>{ if(!a.innerHTML.trim()) a.innerHTML=ARROW; });
}
function buildFlags(){
  const box=$('#flags');
  box.innerHTML = ['mk','en','sq'].map(l=>`<button data-lang="${l}" aria-label="${l}">${FLAGS[l]}</button>`).join('');
  // make gradient/clip ids unique per flag svg (only EN uses ids, but be safe)
  $$('#flags button').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();setLang(b.dataset.lang)}));
}
function setLang(l){
  lang=l; document.documentElement.lang=l;
  $$('[data-i]').forEach(el=>{ const v=T[l][el.dataset.i]; if(v!==undefined) el.textContent=v; });
  $$('#flags button').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));
  if(current==='sorry') $('#sorryMsg').textContent = T[l][sorryKey];
  refreshNext();
}
let sorryKey='sorryAge';

function nextSection(from){
  return SECTIONS.find(s=>!visited.has(s) && s!==from) || null;
}
function refreshNext(){
  if(!SECTIONS.includes(current)) return;
  const nx = nextSection(current);
  $$('.screen.active [data-next], .screen.leaving [data-next]').forEach(el=>{
    el.textContent = nx ? T[lang][nx] : T[lang].next;
  });
}

function show(name){
  const prev = current && $(`[data-screen="${current}"]`);
  const next = $(`[data-screen="${name}"]`);
  if(!next || prev===next) return;
  clearTimeout(sorryTimer);
  $$('.cols').forEach(c=>{c.classList.remove('has-sel','touched');$$('.col',c).forEach(x=>x.classList.remove('sel'))});
  if(prev){ prev.classList.remove('active'); prev.classList.add('leaving'); setTimeout(()=>prev.classList.remove('leaving'),700); }
  current=name;
  app.dataset.bg = next.dataset.bg || 'none';
  // (re)render animated logos so the X draws in every time the screen appears
  $$('[data-logo]',next).forEach(el=>{ el.innerHTML = logoSVG(); });
  $$('[data-xi]',next).forEach(el=>{ el.innerHTML = xiSVG(); });
  // restart CSS animations cleanly
  next.classList.remove('active'); void next.offsetWidth;
  next.classList.add('active');
  const w=$('#wipe'); w.classList.remove('go'); void w.offsetWidth; w.classList.add('go');
  refreshNext();
  next.scrollTop=0;
}
function go(name,ms=420){ if(lock) return; lock=true; setTimeout(()=>lock=false,ms+300); show(name); }

function startSection(s){ go(s); }
function afterSection(){
  visited.add(current);
  const nx = nextSection(current);
  go(nx || 'choose');
}
function reset(){
  visited.clear(); lock=false;
  setLang('en');
  show('age');
}
function sorry(key){ sorryKey=key; $('#sorryMsg').textContent=T[lang][key]; go('sorry'); sorryTimer=setTimeout(reset,SORRY_MS); }

document.addEventListener('click',e=>{
  tryFullscreenOnce();
  bump();
  const pk = e.target.closest('[data-pack]');
  if(pk){ const cols=pk.parentElement, was=pk.classList.contains('sel');
    $$('.col',cols).forEach(c=>c.classList.remove('sel'));
    if(!was) pk.classList.add('sel');
    cols.classList.toggle('has-sel',!was); cols.classList.add('touched'); return; }
  const b = e.target.closest('[data-act],[data-sec]'); if(!b) return;
  if(b.dataset.sec){ startSection(b.dataset.sec); return; }
  switch(b.dataset.act){
    case 'ageYes': go('smoker'); break;
    case 'ageNo': sorry('sorryAge'); break;
    case 'smokerYes': go('welcome'); break;
    case 'smokerNo': sorry('sorrySmoker'); break;
    case 'toMenu': go('menu'); break;
    case 'next': afterSection(); break;
    case 'finish': go('end'); break;
    case 'restart': reset(); break;
  }
});

/* idle -> back to the start (handy at events) */
function bump(){
  clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{ if(current!=='age') reset(); },IDLE_MS);
}
['touchstart','pointerdown'].forEach(ev=>document.addEventListener(ev,bump,{passive:true}));

/* fullscreen */
const FS_IN='<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
const FS_OUT='<svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
const fsBtn=$('#fs');
function isFS(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
function toggleFS(){
  const el=document.documentElement;
  try{
    if(isFS()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
    else { (el.requestFullscreen||el.webkitRequestFullscreen).call(el,{navigationUI:'hide'}); }
  }catch(e){}
}
let triedFS=false;
function tryFullscreenOnce(){ if(triedFS) return; triedFS=true; if(!isFS()) toggleFS(); }
fsBtn.addEventListener('click',e=>{e.stopPropagation(); triedFS=true; toggleFS(); bump();});
function syncFS(){ fsBtn.innerHTML = isFS()?FS_OUT:FS_IN; }
document.addEventListener('fullscreenchange',syncFS); document.addEventListener('webkitfullscreenchange',syncFS);
document.addEventListener('contextmenu',e=>e.preventDefault());

/* floating copper dust */
(function(){
  const c=$('#fx'), x=c.getContext('2d'); let W,H,parts=[];
  function size(){ const r=devicePixelRatio>1?1.5:1; W=c.width=innerWidth*r; H=c.height=innerHeight*r; }
  function mk(init){ return {x:Math.random()*W,y:init?Math.random()*H:H+10,r:(Math.random()*2.2+.6)*(W>H?1:1)*(W/1200>1?1.4:1),
    v:Math.random()*.35+.12,a:Math.random()*.5+.15,ph:Math.random()*6.28,dr:(Math.random()-.5)*.25}; }
  size(); addEventListener('resize',()=>{size();});
  for(let i=0;i<46;i++) parts.push(mk(true));
  function tick(t){
    x.clearRect(0,0,W,H);
    for(const p of parts){
      p.y-=p.v; p.x+=p.dr+Math.sin(t/2000+p.ph)*.15;
      if(p.y<-10){Object.assign(p,mk(false));}
      const tw=.5+.5*Math.sin(t/700+p.ph);
      x.beginPath(); x.fillStyle=`rgba(235,160,115,${(p.a*tw).toFixed(3)})`; x.arc(p.x,p.y,p.r,0,6.283); x.fill();
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

/* init */
buildHeroes(); buildFlags(); setLang('en'); syncFS();
window.__show = show; window.__setLang = setLang;   // for testing
show('age'); bump();
</script>
</body>
</html>
